name: Container Release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: .github/scripts/verify-signed-release-tag.sh

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/igloo
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build container image
        run: docker build --pull -t ghcr.io/screwys/igloo:latest .

      - name: Check fresh container setup
        env:
          CONTAINER_RUNTIME: docker
          IGLOO_CONTAINER_CHECK_BUILD: "0"
          IGLOO_CONTAINER_CHECK_IMAGE: ghcr.io/screwys/igloo:latest
        run: scripts/dev/container-check.sh

      - name: Push container image
        id: build
        env:
          SOURCE_IMAGE: ghcr.io/screwys/igloo:latest
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag="$(printf '%s\n' "$TAGS" | head -n1)"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag "$SOURCE_IMAGE" "$tag"
            docker push "$tag"
          done <<EOF
          $TAGS
          EOF
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$first_tag" | sed 's/.*@//')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Prepare security artifact directory
        run: mkdir -p release-artifacts

      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/igloo@${{ steps.build.outputs.digest }}
          artifact-name: igloo-container-sbom.spdx.json
          output-file: release-artifacts/igloo-container-${{ github.ref_name }}.spdx.json
          upload-release-assets: false

      - name: Sign container image keyless
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository_owner }}/igloo@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - name: Generate container attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/igloo
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
