name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install PostgreSQL 18 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18
          echo 'IGLOO_POSTGRES_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated drift
        run: scripts/dev/drift-check.sh

      - name: Check database contracts
        run: scripts/dev/schema-check.sh

      - name: Run repo-specific static checks
        run: go run ./scripts/dev/staticcheck

      - name: Run actionlint
        run: |
          . scripts/dev/go-tool-versions.sh
          go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Run golangci-lint
        run: scripts/dev/lint-go.sh run

      - name: Run govulncheck
        run: |
          . scripts/dev/go-tool-versions.sh
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install PostgreSQL 18 tools
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18
          echo 'IGLOO_POSTGRES_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test -timeout 30m ./...

      - name: Run web process-level test
        run: scripts/dev/web-test.sh

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # main
        with:
          use-flakehub: false

      - name: Build Nix server and runtime tools
        run: nix build --impure --refresh .#igloo .#yt-dlp .#gallery-dl --no-link --print-build-logs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - id: filter
        name: Detect Android-relevant changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi
          fi

          selection="$(
            IGLOO_TEST_BASE="$base" \
            IGLOO_TEST_HEAD="$head" \
            IGLOO_TEST_SELECTION_ONLY=1 \
              scripts/dev/test-changed.sh
          )"
          echo "$selection"
          if grep -q 'android=1' <<< "$selection"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report skipped Android CI
        if: steps.filter.outputs.android != 'true'
        run: echo "No Android-relevant changes; Android CI is not required for this ref."

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        if: steps.filter.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "26"

      - name: Run Android unit tests
        if: steps.filter.outputs.android == 'true'
        working-directory: android
        run: ./test.sh
