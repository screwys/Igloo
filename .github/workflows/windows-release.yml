name: Windows Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: .github/scripts/verify-signed-release-tag.sh

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build tools
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2
          wix extension add -g WixToolset.Firewall.wixext/6.0.2

      - name: Generate application assets
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          templ generate
          go run ./cmd/igloo-assets

      - name: Read release versions
        id: versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
            $productVersion = $version
          } else {
            $gradle = Get-Content -Raw android/app/build.gradle.kts
            $baseVersion = [regex]::Match($gradle, 'versionName\s*=\s*"([^"]+)"').Groups[1].Value
            if (-not $baseVersion) { throw "Could not read versionName" }
            $version = "$baseVersion.${env:GITHUB_RUN_NUMBER}"
            $productVersion = $baseVersion
          }
          $runtime = (Get-Content -Raw packaging/windows/windows-runtime.lock.json | ConvertFrom-Json).revision
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "product_version=$productVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "runtime=$runtime" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Require update signing configuration
        shell: pwsh
        env:
          WINDOWS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY_BASE64 }}
          WINDOWS_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          if (-not $env:WINDOWS_UPDATE_PUBLIC_KEY_BASE64) { throw "WINDOWS_UPDATE_PUBLIC_KEY_BASE64 is not configured" }
          if (-not $env:WINDOWS_UPDATE_SIGNING_KEY_BASE64) { throw "WINDOWS_UPDATE_SIGNING_KEY_BASE64 is not configured" }

      - name: Build Windows application and runtime
        shell: pwsh
        env:
          WINDOWS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          packaging/windows/build-app.ps1 `
            -Version "${{ steps.versions.outputs.version }}" `
            -RuntimeRevision "${{ steps.versions.outputs.runtime }}" `
            -UpdatePublicKey $env:WINDOWS_UPDATE_PUBLIC_KEY_BASE64 `
            -OutputDirectory "$env:RUNNER_TEMP/igloo-app"
          packaging/windows/build-runtime.ps1 -OutputDirectory "$env:RUNNER_TEMP/igloo-runtime"
          Compress-Archive -Path "$env:RUNNER_TEMP/igloo-app/*" -DestinationPath "release-artifacts/igloo-app-windows-amd64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/igloo-runtime/*" -DestinationPath "release-artifacts/igloo-runtime-windows-amd64.zip"

      - name: Verify Windows payloads
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:RUNNER_TEMP/igloo-app/igloo.exe" --version
          & "$env:RUNNER_TEMP/igloo-runtime/yt-dlp.exe" --version
          & "$env:RUNNER_TEMP/igloo-runtime/gallery-dl.exe" --version
          & "$env:RUNNER_TEMP/igloo-runtime/deno.exe" --version
          & "$env:RUNNER_TEMP/igloo-runtime/ffmpeg.exe" -version
          & "$env:RUNNER_TEMP/igloo-runtime/ffprobe.exe" -version

      - name: Create and sign update manifest
        shell: pwsh
        env:
          WINDOWS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY_BASE64 }}
          WINDOWS_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          packaging/windows/write-manifest.ps1 `
            -AppVersion "${{ steps.versions.outputs.version }}" `
            -RuntimeVersion "${{ steps.versions.outputs.runtime }}" `
            -MinimumAppVersion "${{ steps.versions.outputs.version }}" `
            -AppArchive "release-artifacts/igloo-app-windows-amd64.zip" `
            -RuntimeArchive "release-artifacts/igloo-runtime-windows-amd64.zip" `
            -OutputPath "release-artifacts/igloo-windows-update.json"
          go run ./cmd/igloo-sign-update `
            --input "release-artifacts/igloo-windows-update.json" `
            --output "release-artifacts/igloo-windows-update.json.sig" `
            --public-key $env:WINDOWS_UPDATE_PUBLIC_KEY_BASE64

      - name: Build Windows installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $payload = "$env:RUNNER_TEMP/installer-payload"
          New-Item -ItemType Directory -Force "$payload/app/current" | Out-Null
          New-Item -ItemType Directory -Force "$payload/runtime/current" | Out-Null
          Copy-Item -Recurse "$env:RUNNER_TEMP/igloo-app/*" "$payload/app/current/"
          Copy-Item -Recurse "$env:RUNNER_TEMP/igloo-runtime/*" "$payload/runtime/current/"
          $marker = "$env:RUNNER_TEMP/.igloo-state-root"
          $mediaMarker = "$env:RUNNER_TEMP/.igloo-media-root"
          $configMarker = "$env:RUNNER_TEMP/.igloo-config-root"
          New-Item -ItemType File -Force $marker | Out-Null
          New-Item -ItemType File -Force $mediaMarker | Out-Null
          New-Item -ItemType File -Force $configMarker | Out-Null
          wix build packaging/windows/Package.wxs `
            -arch x64 `
            -ext WixToolset.Util.wixext `
            -ext WixToolset.Firewall.wixext `
            -d "PayloadDir=$payload" `
            -d "ProductVersion=${{ steps.versions.outputs.product_version }}" `
            -d "StateMarker=$marker" `
            -d "MediaMarker=$mediaMarker" `
            -d "ConfigMarker=$configMarker" `
            -d "InstallerIcon=$env:GITHUB_WORKSPACE/packaging/windows/InstallerIcon.ico" `
            -o "$env:RUNNER_TEMP/Igloo-x64.msi"
          wix msi validate "$env:RUNNER_TEMP/Igloo-x64.msi"
          wix build packaging/windows/Bundle.wxs `
            -arch x64 `
            -ext WixToolset.BootstrapperApplications.wixext `
            -ext WixToolset.Util.wixext `
            -d "MsiPath=$env:RUNNER_TEMP/Igloo-x64.msi" `
            -d "ProductVersion=${{ steps.versions.outputs.product_version }}" `
            -d "InstallerIcon=$env:GITHUB_WORKSPACE/packaging/windows/InstallerIcon.ico" `
            -d "InstallerLogo=$env:GITHUB_WORKSPACE/packaging/windows/InstallerLogo.png" `
            -d "InstallerTheme=$env:GITHUB_WORKSPACE/packaging/windows/InstallerTheme.xml" `
            -o "release-artifacts/IglooSetup-x64.exe"
          Remove-Item "release-artifacts/IglooSetup-x64.wixpdb" -ErrorAction SilentlyContinue

      - name: Run Windows-focused tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go test ./internal/buildinfo ./internal/config ./internal/toolenv ./internal/windowsupdate ./internal/windowsuninstall ./cmd/igloo ./cmd/igloo-update ./cmd/igloo-sign-update ./cmd/igloo-uninstall

      - name: Generate artifact attestations
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: release-artifacts/*

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: igloo-windows-${{ steps.versions.outputs.version }}
          path: release-artifacts/*

      - name: Attach Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: release-artifacts/*
