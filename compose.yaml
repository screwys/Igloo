services:
  igloo:
    image: "${IGLOO_IMAGE:-ghcr.io/screwys/igloo:latest}"
    build:
      context: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${IGLOO_MEM_LIMIT:-2g}
    cpus: "${IGLOO_CPUS:-2.0}"
    ports:
      - "${IGLOO_PORT:-5001}:5001"
      - "${IGLOO_PORT:-5001}:5001/udp"
    environment:
      IGLOO_ENABLED_PLATFORMS: ${IGLOO_ENABLED_PLATFORMS:-}
      IGLOO_PUBLISHED_SERVER_URL: ${IGLOO_PUBLISHED_SERVER_URL:-}
    volumes:
      - igloo-state:/igloo

volumes:
  igloo-state:
    name: "${IGLOO_STATE_VOLUME:-igloo-state}"
